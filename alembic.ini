# Alembic конфигурациясы
# МАҢЫЗДЫ: осы файл орналасқан папкадан іске қосу керек (project root)

[alembic]
# Migration файлдары осы папкада
script_location = alembic

# Migration файлдарының аты шаблоны
file_template = %%(rev)s_%%(slug)s

# sys.path-қа project root-ты қосады — models, config, db импорттары жұмыс істесін
prepend_sys_path = .

# sqlalchemy.url осында жоқ — settings арқылы env.py ішінде алынады
# (парольді git-ке түсірмеу үшін)

[post_write_hooks]
# (бос — hook жоқ)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
